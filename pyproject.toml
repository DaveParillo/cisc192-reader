[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cisc192-reader"
version = "1.1.0"
description = "CISC 192 textbook source built with Sphinx and sphinx-touchbook."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.txt" }

[project.optional-dependencies]
docs = [
    "Sphinx>=8",
    "accessible-pygments",
    "sphinx-accessibility",
    "sphinx-copybutton",
    "sphinx-nefertiti",
    "sphinx-touchbook",
]

[tool.setuptools]
py-modules = []
